name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Download offline chess engine assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/vendor www/vendor/pieces

          download() {
            local url="$1"
            local output="$2"
            echo "Downloading: $output"
            curl --fail --location --show-error               --retry 10 --retry-all-errors --retry-delay 5               --connect-timeout 30 --max-time 600               --output "$output" "$url"
            test -s "$output"
            echo "Downloaded successfully: $output"
          }

          download "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" "www/vendor/chess.min.js"

          download "https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-single.js" "www/vendor/stockfish-18-single.js"
          download "https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-single.wasm" "www/vendor/stockfish-18-single.wasm"

          download "https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.js" "www/vendor/stockfish-18-lite-single.js"
          download "https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.wasm" "www/vendor/stockfish-18-lite-single.wasm"

          download "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js" "www/vendor/stockfish.js"

          for p in wP wN wB wR wQ wK bP bN bB bR bQ bK; do
            download "https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${p}.svg" "www/vendor/pieces/${p}.svg"
          done

          ls -lh www/vendor
          ls -lh www/vendor/pieces

      - name: Add Android platform
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists."
          else
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure AndroidX + Jetifier are enabled
        shell: bash
        run: |
          touch android/gradle.properties
          grep -qxF 'android.useAndroidX=true' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -qxF 'android.enableJetifier=true' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
