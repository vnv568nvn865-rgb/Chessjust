name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      # Bundle the chess engine + move library + piece images INTO the app
      # itself, so the board and Stockfish analysis work fully offline once
      # installed. Only the Chess.com game search still needs internet
      # (unavoidable, since it talks to Chess.com's servers).
      - name: Download offline chess engine assets
        run: |
          mkdir -p www/vendor www/vendor/pieces
          curl -fL -o www/vendor/chess.min.js https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js

          # Primary engine: FULL-strength Stockfish 18 NNUE, single-threaded
          # (no CORS/cross-origin-isolation headers needed). Stronger per-node
          # evaluation than the "lite" build we used before.
          curl -fL -o www/vendor/stockfish-18-single.js \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-single.js
          curl -fL -o www/vendor/stockfish-18-single.wasm \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-single.wasm

          # Secondary tier: lighter NNUE build, in case the full one fails on
          # a particular device (memory, older WebView, etc.)
          curl -fL -o www/vendor/stockfish-18-lite-single.js \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.js
          curl -fL -o www/vendor/stockfish-18-lite-single.wasm \
            https://github.com/nmrugg/stockfish.js/releases/download/v18.0.0/stockfish-18-lite-single.wasm

          # Fallback engine (old classical asm.js) kept in case the NNUE/WASM
          # build ever fails to load on a particular device.
          curl -fL -o www/vendor/stockfish.js https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js

          # Classic clear piece set (Cburnett, the same set Lichess uses),
          # openly licensed under GPLv2+.
          for p in wP wN wB wR wQ wK bP bN bB bR bQ bK; do
            curl -fL -o "www/vendor/pieces/${p}.svg" \
              "https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${p}.svg"
          done

          ls -la www/vendor www/vendor/pieces

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      # Fixes problem #6 from the project notes: checkDebugAarMetadata /
      # AndroidX errors caused by these two flags being missing.
      - name: Ensure AndroidX + Jetifier are enabled
        run: |
          grep -qxF 'android.useAndroidX=true' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -qxF 'android.enableJetifier=true' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
