<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chessjust — الافتتاحيات</title><style>:root{--bg:#0b1118;--p:#151e29;--p2:#1b2734;--l:#2d3a49;--ink:#f3f6f9;--d:#9aa8b7;--g:#d9b35b;--ok:#63ba7b;--bad:#d65d5d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101923,#0b1118);color:var(--ink);font-family:system-ui,Arial;touch-action:manipulation}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);position:sticky;top:0;background:#0b1118ed;z-index:5}.nav{display:flex;gap:6px}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--l);padding:7px 9px;border-radius:9px;font-size:11px}main{max-width:900px;margin:auto;padding:14px}.head,.board,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px}.head{padding:14px;margin-bottom:12px}.head h1{margin:0 0 4px;font-size:20px}.head p{margin:0;color:var(--d);font-size:12px}.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.pill{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:7px 10px;font-size:11px}.pill b{color:var(--g)}.board{padding:10px;max-width:620px;margin:auto}.sqboard{direction:ltr;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;touch-action:none}.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,52px);cursor:pointer;-webkit-tap-highlight-color:transparent}.light{background:#d9c7a1}.dark{background:#8a6b4d}.sel{outline:4px solid #63a6d8;outline-offset:-4px}.piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.panel{padding:12px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.msg{line-height:1.7;color:var(--d);font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:800;touch-action:manipulation}.btn.primary{border-color:var(--g);color:var(--g)}.line{direction:ltr;display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.move{background:#202b37;border:1px solid #344252;border-radius:7px;padding:5px 7px;font-family:monospace}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.hint{font-size:12px;color:var(--g);margin-top:8px;font-weight:700}</style></head><body><header class="top"><b>♞ Chessjust — ♟️ أكاديمية الافتتاحيات</b><nav class="nav"><a href="academy.html">الأكاديمية</a><a href="tactics.html">التكتيكات</a><a href="openings.html">الافتتاحيات</a><a href="puzzles.html">الألغاز</a></nav></header><main><section class="head"><h1>♟️ أكاديمية الافتتاحيات</h1><p id="sub">كل الخطوط التدريبية محفوظة محليًا لتكون الاستجابة فورية.</p><div class="bar"><div class="pill">الافتتاح: <b id="branch">—</b></div><div class="pill">التقدم: <b id="progress">0/0</b></div><div class="pill">متقن: <b id="mastered">0</b></div></div></section><section class="panel"><div class="buttons" id="openingChoices"></div><div class="buttons" id="branchChoices"></div></section><section class="board"><div id="board" class="sqboard"></div></section><section class="panel"><div class="row"><b id="title">الموقف</b><span id="turn">دورك</span></div><div class="msg" id="msg"></div><div class="bar"><button class="btn primary" id="next">ابدأ التدريب</button><button class="btn" id="hint">💡 أفضل نقلة</button></div><div class="line" id="moves"></div><div class="line" id="line"></div><div class="result" id="result"></div></section></main><script src="./vendor/chess.min.js"></script><script src="./js/chessjust-progress.js"></script><script>
const openings=[{id:'italian',name:'الإيطالية',branches:[['الفرع الهادئ','e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6'],['الضغط المركزي','e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Nc3 Nxe4'],['هجوم سريع','e4 e5 Nf3 Nc6 Bc4 Nf6 d4 exd4 O-O Nxe4 Re1 d5 Bxd5 Qxd5']]},{id:'sicilian',name:'الصقلية',branches:[['التنين','e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 Nc3 Bg7 Be3 Nf6 Qd2 O-O'],['نايدورف','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5'],['كلاسيكي','e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 Nf6 Nc3 d6 Be3 Be7']]},{id:'qgd',name:'جامبيت الوزير',branches:[['كلاسيكي','d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 Nbd7'],['تبادل','d4 d5 c4 e6 Nc3 Nf6 cxd5 exd5 Bg5 Be7 e3 O-O'],['سلاف','d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6']]},{id:'ruy',name:'روي لوبيز',branches:[['مورفي','e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5'],['برلين','e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 Re1 Nd6'],['مارشال تمهيدي','e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 O-O']]},{id:'london',name:'نظام لندن',branches:[['الخطة الهادئة','d4 Nf6 Nf3 d5 Bf4 e6 e3 Bd6 Bd3 O-O O-O c5'],['ضغط جناح الوزير','d4 Nf6 Nf3 d5 Bf4 c5 e3 Nc6 c3 Bf5 Nbd2 e6'],['هجوم الملك','d4 Nf6 Nf3 d5 Bf4 e6 e3 Bd6 Bd3 O-O O-O c5']]}];
let current=0,branchIndex=0,chess=null,sequence=[],pos=0,selected=null,active=false,replyTimer=null,restored=false;
const $=id=>document.getElementById(id),files=['a','b','c','d','e','f','g','h'];
function key(){return openings[current].id+'-'+branchIndex}
function buildSelectors(){const oc=$('openingChoices'),bc=$('branchChoices');oc.innerHTML='';openings.forEach((o,i)=>{const b=document.createElement('button');b.className='btn '+(i===current?'primary':'');b.textContent=o.name;b.onclick=()=>{current=i;branchIndex=0;loadBranch()};oc.appendChild(b)});bc.innerHTML='';openings[current].branches.forEach((br,i)=>{const b=document.createElement('button');b.className='btn '+(i===branchIndex?'primary':'');b.textContent=br[0];b.onclick=()=>{branchIndex=i;loadBranch()};bc.appendChild(b)})}
function loadBranch(){clearTimeout(replyTimer);const p=CJProgress.get().openings;if(!restored){current=Number.isInteger(p.currentOpening)?Math.min(p.currentOpening,openings.length-1):current;branchIndex=Number.isInteger(p.currentBranch)?Math.min(p.currentBranch,2):branchIndex;restored=true;}sequence=openings[current].branches[branchIndex][1].split(/\s+/);const saved=p.progress[key()]||0;chess=new Chess();pos=0;selected=null;active=false;for(let i=0;i<saved&&i<sequence.length;i++){const m=chess.move(sequence[i]);if(!m)break;pos++;}renderBoard();renderMoves();renderProgress();buildSelectors();$('branch').textContent=`${openings[current].name} — ${openings[current].branches[branchIndex][0]}`;$('msg').textContent=saved?`استأنفت من آخر تقدم: ${pos}/${sequence.length}. اضغط ابدأ التدريب.`:'اضغط ابدأ التدريب ثم حرّك القطعة.'}
function renderBoard(){const b=$('board');b.innerHTML='';for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq=files[f]+r,d=document.createElement('div');d.className='sq '+(((f+r)%2)?'dark':'light');if(selected===sq)d.classList.add('sel');const pc=chess.get(sq);if(pc){const img=document.createElement('img');img.className='piece';img.src=`./vendor/pieces/${pc.color}${pc.type.toUpperCase()}.svg`;img.onerror=()=>{img.remove();d.textContent={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[pc.type]};d.appendChild(img)}d.onpointerup=()=>click(sq);b.appendChild(d)}}
function renderMoves(){$('moves').innerHTML=chess.history().map((m,i)=>`<span class="move">${Math.floor(i/2)+1}${i%2?'...':'.'} ${m}</span>`).join('')}
function renderProgress(){$('progress').textContent=pos+'/'+sequence.length;$('mastered').textContent=CJProgress.get().openings.mastered.length}
function start(){active=true;$('msg').textContent=`دورك. النقلة ${pos+1} من ${sequence.length}.`}
function expected(){if(!sequence[pos])return null;try{const c=new Chess(chess.fen()),m=c.move(sequence[pos]);return m?{uci:m.from+m.to+(m.promotion||''),san:m.san}:null}catch(e){return null}}
function click(sq){if(!active||!chess||replyTimer)return;if(!selected){if(chess.get(sq)?.color===chess.turn()){selected=sq;renderBoard()}return}const before=chess.fen();const mv=chess.move({from:selected,to:sq,promotion:'q'});if(!mv){selected=chess.get(sq)?.color===chess.turn()?sq:null;renderBoard();return}selected=null;const exp=expectedFromFen(before,sequence[pos]);const u=mv.from+mv.to+(mv.promotion||'');if(!exp||u!==exp.uci){chess.undo();renderBoard();$('msg').textContent='❌ ليست النقلة المحفوظة في هذا الفرع.';return}pos++;renderBoard();renderMoves();savePos();renderProgress();if(pos>=sequence.length){active=false;CJProgress.opening(key(),true,current,branchIndex,pos);$('msg').textContent='🏆 أتقنت هذا الفرع!';return}const reply=sequence[pos];const rm=chess.move(reply);if(rm){$('line').innerHTML+=`<span class="move">${rm.san}</span>`;pos++;}savePos();renderBoard();renderMoves();renderProgress();replyTimer=setTimeout(()=>{replyTimer=null;active=true;$('msg').textContent=pos>=sequence.length?'🏆 اكتمل الفرع!':`دورك. النقلة ${pos+1} من ${sequence.length}.`},600)}
function expectedFromFen(fen,uci){try{const c=new Chess(fen),m=c.move(uci);return m?{uci:m.from+m.to+(m.promotion||''),san:m.san}:null}catch(e){return null}}
function savePos(){CJProgress.opening(key(),false,current,branchIndex,pos)}
$('next').onclick=start;$('hint').onclick=()=>{const e=expected();$('msg').textContent=e?`💡 النقلة المحفوظة في هذا الفرع: ${e.san}`:'لا توجد نقلة متبقية.'};
loadBranch();
</script></body></html>
