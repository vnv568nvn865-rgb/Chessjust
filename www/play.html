<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chessjust — العب</title>
<style>:root{--bg:#0d1117;--panel:#151b24;--line:#2b3542;--ink:#f1f4f7;--dim:#9da9b6;--gold:#d9b35b;--green:#65b27a;--red:#d05a5a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2230 0,#0d1117 45%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.top{max-width:900px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.top small{color:var(--dim)}.nav{display:flex;gap:8px}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:9px;font-size:12px}.wrap{max-width:900px;margin:auto;padding:0 14px 30px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.mode button,.actions button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:700}.mode button.active{border-color:var(--gold);color:var(--gold)}.game{display:grid;grid-template-columns:minmax(280px,560px) 1fr;gap:14px;align-items:start}.board{direction:ltr;width:min(92vw,560px);height:min(92vw,560px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:5px solid #202832;border-radius:6px;overflow:hidden;box-shadow:0 14px 40px #0008}.sq{display:flex;align-items:center;justify-content:center;position:relative;user-select:none}.sq.light{background:#d9c7a1}.sq.dark{background:#8a6b4d}.sq.sel{outline:4px solid #5da4d6;outline-offset:-4px}.sq.last{box-shadow:inset 0 0 0 4px #8fc46a}.sq img{width:88%;height:88%;object-fit:contain;pointer-events:none}.coord{position:absolute;z-index:3;font-size:clamp(9px,1.8vw,14px);font-weight:800;line-height:1;pointer-events:none;text-shadow:0 1px 2px #0008}.coord.file{left:4px;bottom:3px}.coord.rank{right:4px;top:3px}.sq.light .coord{color:#6f5238}.sq.dark .coord{color:#ead8b4}.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.status{font-weight:800;margin-bottom:8px}.eval{font-family:monospace;font-size:22px;color:var(--gold)}.hint{color:var(--dim);font-size:13px;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button:disabled{opacity:.45}.actions button.danger{border-color:var(--red);color:var(--red)}.actions button.primary{border-color:var(--gold);color:var(--gold)}.moves{margin-top:12px;max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}.move{background:#202834;border:1px solid #303b49;border-radius:7px;padding:6px 8px;font-family:monospace}.explain{margin-top:12px;padding:10px;border-radius:10px;background:#10161e;border:1px solid var(--line);line-height:1.7;font-size:13px}@media(max-width:760px){.game{grid-template-columns:1fr}.side{width:min(92vw,560px);margin:auto}.mode{grid-template-columns:1fr 1fr 1fr}.top{align-items:flex-start}.nav{display:none}}
/* v17 visual system: native-app-like shell + external board coordinates */
body{background:linear-gradient(180deg,#0b1016 0%,#0f1620 55%,#0b1016 100%);}
.top{padding:18px 16px;position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.top h1{font-size:21px;letter-spacing:.2px}.top small{font-size:11px}.nav a,.mode button,.actions button{box-shadow:0 4px 14px #0004;transition:.18s ease}.nav a:active,.mode button:active,.actions button:active{transform:translateY(1px) scale(.99)}
.board-shell{display:grid;grid-template-columns:24px auto;grid-template-rows:auto 24px;gap:3px;justify-content:center;align-items:stretch;direction:ltr;margin:0 auto;width:fit-content;max-width:100%;}
.board-shell>div:nth-child(2){min-width:0;width:min(86vw,560px)}.board-shell .board{width:100%;height:auto;aspect-ratio:1/1;}
.rank-rail{display:grid;grid-template-rows:repeat(8,1fr);font:800 12px/1 monospace;align-items:center;text-align:center;color:var(--dim);padding:2px 0;}
.file-rail{display:grid;grid-template-columns:repeat(8,1fr);font:800 12px/1 monospace;text-align:center;align-items:center;color:var(--dim);height:24px;}
.sq .coord{display:none!important;}
@media(max-width:760px){.board-shell{grid-template-columns:20px auto;grid-template-rows:auto 20px}.rank-rail,.file-rail{font-size:10px}.file-rail{height:20px}}
</style></head><body>
<div class="top"><div><h1>♞ Chessjust — العب</h1><small>لعب محلي ضد Stockfish</small></div><div class="nav"><a href="index.html">التحليل</a><a href="coach.html">المدرب</a></div></div>
<div class="wrap"><div class="mode"><button class="active" data-mode="normal">⚔️ Stockfish</button><button data-mode="beast">👹 الوحش الهجومي</button><button data-mode="defense">🛡️ دفاع الوحش</button></div>
<div class="game"><div><div class="board-shell"><div class="rank-rail" id="rankRail"></div><div><div class="file-rail" id="fileRail"></div><div id="board" class="board"></div></div></div><div class="actions"><button class="primary" id="newGame">🔄 مباراة جديدة</button><button id="flip">↔️ قلب الرقعة</button><button id="bestMove">💡 أفضل نقلة</button><button id="resign">🏳️ استسلام</button></div></div></div><div class="side"><div id="status" class="status">اختر نقلة</div><div id="eval" class="eval">+0.00</div><div id="hint" class="hint">العب ضد Stockfish محليًا. في وضع الوحش سيحاول المحرك اختيار خطوط أكثر حدة وضغطًا ضمن هامش تقييم معقول.</div><div class="explain" id="explain">💡 بعد المواقف المهمة سيظهر شرح محلي يوضح التهديد أو سبب أفضل رد، بدون API خارجي.</div><div class="moves" id="moves"></div></div></div></div>
<script src="./vendor/chess.min.js"></script><script>
'use strict';
const PIECE=(c,t)=>`./vendor/pieces/${c}${t.toUpperCase()}.svg`;
const MODES=['normal','beast','defense'];
const modeState={};
for(const m of MODES) modeState[m]={game:new Chess(),lastMove:null,selected:null,ended:false};
let mode='normal', flipped=false, worker=null, engineReady=false, enginePath='./vendor/stockfish-18-single.js';
let busy=false, pendingMoveResolve=null, engineCandidates=[], engineTimer=null, stabilityTimer=null;
let lastInfo={depth:0,score:0,pv:'',nodes:0,stable:0,lastChange:0};
let precompute=null;
const $=id=>document.getElementById(id);
function state(){return modeState[mode]}
function boardSquares(){const a=[];for(let r=0;r<8;r++)for(let f=0;f<8;f++)a.push(String.fromCharCode(97+f)+(8-r));return a}
function draw(){const st=state(), b=$('board');b.innerHTML='';let sqs=boardSquares();if(flipped)sqs.reverse();
 const files=[...'abcdefgh'], ranks=['8','7','6','5','4','3','2','1'];
 const rf=$('rankRail'),ff=$('fileRail');
 if(rf)rf.innerHTML=(flipped?[...ranks].reverse():ranks).map(x=>`<span>${x}</span>`).join('');
 if(ff)ff.innerHTML=(flipped?[...files].reverse():files).map(x=>`<span>${x}</span>`).join('');
 for(const sq of sqs){const f=sq.charCodeAt(0)-97,r=8-Number(sq[1]),d=document.createElement('div');d.className='sq '+((f+r)%2?'dark':'light');
  if(st.selected===sq)d.classList.add('sel');if(st.lastMove&&(st.lastMove.from===sq||st.lastMove.to===sq))d.classList.add('last');
  const pc=st.game.get(sq);if(pc){const img=document.createElement('img');img.src=PIECE(pc.color,pc.type);img.onerror=()=>{img.remove();d.appendChild(document.createTextNode({p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[pc.type]))};d.appendChild(img)}
  d.onclick=()=>clickSq(sq);b.appendChild(d)}}
function renderMoves(){const arr=state().game.history();$('moves').innerHTML=arr.map((m,i)=>`<span class="move">${Math.floor(i/2)+1}${i%2?'...':'.'} ${m}</span>`).join('')}
function updateStatus(){const st=state(),g=st.game;let txt=g.in_checkmate()?(g.turn()==='w'?'كش مات — Stockfish فاز':'كش مات — أنت فز'):g.in_draw()?'تعادل':st.ended?'انتهت المباراة':g.turn()==='w'?'دورك':'Stockfish يفكر...';$('status').textContent=txt;
 const end=g.game_over()||st.ended;$('bestMove').disabled=end||busy||g.turn()!=='w';$('resign').disabled=end||busy||g.turn()!=='w'}
function explainMove(mv){let s='نقلة جيدة، راقب تهديدات الخصم بعد كل نقلة.';if(mv.captured)s=`أخذت ${mv.captured}. انتبه إلى الرد الإجباري وإعادة حساب حماية القطعة.`;if(mv.san.includes('+'))s='كش! النقلة تخلق تهديدًا مباشرًا، لكن يجب التأكد من الردود الإجبارية.';$('explain').textContent=s}
function clickSq(sq){const st=state(),g=st.game;if(busy||g.game_over()||st.ended||g.turn()!=='w')return;
 if(!st.selected){if(g.get(sq)?.color==='w'){st.selected=sq;draw()}return}
 const mv=g.move({from:st.selected,to:sq,promotion:'q'});if(!mv){if(g.get(sq)?.color==='w')st.selected=sq;else st.selected=null;draw();return}
 st.lastMove={from:mv.from,to:mv.to};st.selected=null;busy=true;renderMoves();explainMove(mv);draw();updateStatus();
 // Give the engine a tiny scheduling gap so the UI paints the move before search begins.
 setTimeout(engineTurn,40);
}
function makeWorker(path){if(worker)worker.terminate();clearTimeout(engineTimer);clearTimeout(stabilityTimer);engineReady=false;enginePath=path||'./vendor/stockfish-18-single.js';
 worker=new Worker(enginePath);worker.onerror=()=>{if(enginePath!=='./vendor/stockfish-18-lite-single.js'){makeWorker('./vendor/stockfish-18-lite-single.js')}else{busy=false;$('status').textContent='تعذر تشغيل Stockfish'}};
 worker.onmessage=e=>{const x=String(e.data||'');
  if(x==='uciok'){worker.postMessage('setoption name Threads value 1');worker.postMessage('setoption name Hash value 64');worker.postMessage('setoption name MultiPV value 1');worker.postMessage('isready')}
  else if(x==='readyok'){engineReady=true;}
  else if(x.startsWith('id name')){$('hint').dataset.engine=x.slice(8).trim()}
  else if(x.startsWith('info')) handleInfo(x);
  else if(x.startsWith('bestmove')){clearTimeout(engineTimer);clearTimeout(stabilityTimer);const u=x.split(/\s+/)[1];if(u&&pendingMoveResolve){const r=pendingMoveResolve;const candidates=engineCandidates.filter(Boolean);pendingMoveResolve=null;engineCandidates=[];r({chosen:candidates.find(z=>z.uci===u)||{uci:u,score:lastInfo.score,pv:u},candidates,info:{...lastInfo}})}}
 };
 worker.postMessage('uci')}
function parseScore(x){const m=x.match(/score (cp|mate) (-?\d+)/);if(!m)return null;return m[1]==='cp'?Number(m[2]):(Number(m[2])>0?100000:-100000)}
function handleInfo(x){const depthM=x.match(/\bdepth (\d+)/),nodesM=x.match(/\bnodes (\d+)/),pvM=x.match(/\spv\s(.+)$/),score=parseScore(x);if(depthM)lastInfo.depth=Number(depthM[1]);if(nodesM)lastInfo.nodes=Number(nodesM[1]);if(score!==null){if(score!==lastInfo.score||pvM?.[1]?.split(/\s+/)[0]!==lastInfo.pv){lastInfo.stable=0;lastInfo.lastChange=performance.now();}else lastInfo.stable++;lastInfo.score=score}if(pvM)lastInfo.pv=pvM[1].trim().split(/\s+/)[0];
 if(score!==null)$('eval').textContent=Math.abs(score)>=100000?`#${score>0?'∞':'−∞'}`:(score/100).toFixed(2);
 if(lastInfo.depth>=10 && lastInfo.stable>=3 && performance.now()-lastInfo.lastChange>260 && pendingMoveResolve){clearTimeout(stabilityTimer);stabilityTimer=setTimeout(()=>{if(pendingMoveResolve)worker.postMessage('stop')},120)}
}
function waitReady(){return new Promise(resolve=>{if(engineReady)return resolve(true);const t=Date.now();const f=()=>engineReady?resolve(true):Date.now()-t>5000?resolve(false):setTimeout(f,40);f()})}
function searchEngine(fen,maxMs){return new Promise(resolve=>{if(!worker){makeWorker()}pendingMoveResolve=resolve;engineCandidates=[];lastInfo={depth:0,score:0,pv:'',nodes:0,stable:0,lastChange:performance.now()};
 const started=performance.now();worker.postMessage('stop');worker.postMessage('setoption name MultiPV value 1');worker.postMessage('position fen '+fen);worker.postMessage('go infinite');
 clearTimeout(engineTimer);engineTimer=setTimeout(()=>{if(pendingMoveResolve)worker.postMessage('stop')},maxMs);
})}
function attackScore(uci,g){try{const c=new Chess(g.fen()),mv=c.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'});if(!mv)return-999;let s=0;if(mv.san.includes('+'))s+=7;if(mv.captured)s+=2;if(mv.san.includes('#'))s+=100;return s}catch{return 0}}
async function engineTurn(){const st=state(),g=st.game;if(g.game_over()||g.turn()!=='b'||st.ended){busy=false;updateStatus();return}if(!engineReady)makeWorker();if(!(await waitReady())){busy=false;$('status').textContent='تعذر تشغيل Stockfish';return}
 const limit=mode==='normal'?7000:mode==='beast'?7000:6500;$('status').textContent='Stockfish يحسب أقوى نقلة...';const r=await searchEngine(g.fen(),limit);if(!r?.chosen){busy=false;updateStatus();return}
 let chosen=r.chosen;if(mode!=='normal'&&r.candidates.length){const best=r.chosen.score,margin=mode==='beast'?90:45;const eligible=r.candidates.filter(x=>Math.abs(best-x.score)<=margin);if(eligible.length)chosen=eligible.sort((a,b)=>attackScore(b.uci,g)-attackScore(a.uci,g))[0]}
 const u=chosen.uci,mv=g.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(mv){st.lastMove={from:mv.from,to:mv.to};renderMoves();explainEngineMove(mv,mode)}busy=false;draw();updateStatus();precomputeReply(g)}
function explainEngineMove(mv,m){if(m==='beast')$('explain').textContent=mv.san.includes('+')?'👹 هجوم مباشر: كش وإجبار الملك على الرد.':'👹 الوحش يفضّل ضغطًا حادًا عندما يكون قريبًا في التقييم: راقب التهديد التالي وفتح الخطوط حول الملك.';else if(m==='defense')$('explain').textContent='🛡️ هذا الوضع يركز على الضغط والدفاع: ابحث عن التهديد التالي وحافظ على أمان الملك.';else $('explain').textContent='🤖 Stockfish اختار أقوى نقلة متاحة ضمن البحث الحالي.'}
async function showBestMove(){const st=state(),g=st.game;if(busy||g.game_over()||g.turn()!=='w')return;busy=true;updateStatus();$('status').textContent='يحسب أفضل نقلة...';try{const r=await searchEngine(g.fen(),7000);const u=r?.chosen?.uci;if(u){const c=new Chess(g.fen()),mv=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});if(mv){$('explain').textContent=`💡 أفضل نقلة حاليًا: ${mv.san} — العمق ${r.info.depth}، ${r.info.nodes.toLocaleString()} عقدة.`;}}}finally{busy=false;updateStatus()}}
function resignGame(){const st=state();if(st.game.game_over()||st.ended)return;st.ended=true;busy=false;if(worker)worker.postMessage('stop');$('status').textContent='🏳️ استسلمت — انتهت المباراة';$('explain').textContent='ابدأ مباراة جديدة أو اختر وضعًا آخر.';updateStatus()}
function resetMode(m){modeState[m]={game:new Chess(),lastMove:null,selected:null,ended:false}}
function switchMode(m){if(m===mode)return;if(worker)worker.postMessage('stop');clearTimeout(engineTimer);clearTimeout(stabilityTimer);busy=false;resetMode(m);mode=m;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('hint').textContent=mode==='normal'?'⚔️ Stockfish: أقصى قوة عملية مع بحث تكيفي حتى 7 ثوانٍ عند الحاجة.':mode==='beast'?'👹 الوحش: ضغط وتكتيك وهجوم على الملك مع اختيار حاد بين النقلات القوية.':'🛡️ دفاع الوحش: يختبر قدرتك على الصمود أمام ضغط مستمر وتكتيكات قوية.';$('eval').textContent='+0.00';$('explain').textContent='💡 بدأت مباراة مستقلة لهذا الوضع.';renderMoves();draw();updateStatus();}
function precomputeReply(g){/* Safe lightweight pre-search: analyze the top white continuation only while the player thinks. */if(g.turn()!=='w'||g.game_over()||mode!=='normal')return;precompute=null;}
$('newGame').onclick=()=>{if(worker)worker.postMessage('stop');resetMode(mode);busy=false;$('eval').textContent='+0.00';$('explain').textContent='💡 مباراة جديدة. حاول اكتشاف التهديد قبل النقلة.';renderMoves();draw();updateStatus()};
$('flip').onclick=()=>{flipped=!flipped;draw()};$('bestMove').onclick=showBestMove;$('resign').onclick=resignGame;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));
makeWorker();draw();renderMoves();updateStatus();
</script></body></html>
