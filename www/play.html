<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chessjust — العب</title>
<style>:root{--bg:#0d1117;--panel:#151b24;--line:#2b3542;--ink:#f1f4f7;--dim:#9da9b6;--gold:#d9b35b;--green:#65b27a;--red:#d05a5a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2230 0,#0d1117 45%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.top{max-width:900px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.top small{color:var(--dim)}.nav{display:flex;gap:8px}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:9px;font-size:12px}.wrap{max-width:900px;margin:auto;padding:0 14px 30px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}.mode button,.actions button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:700}.mode button.active{border-color:var(--gold);color:var(--gold)}.game{display:grid;grid-template-columns:minmax(280px,560px) 1fr;gap:14px;align-items:start}.board{direction:ltr;width:min(92vw,560px);height:min(92vw,560px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:5px solid #202832;border-radius:6px;overflow:hidden;box-shadow:0 14px 40px #0008}.sq{display:flex;align-items:center;justify-content:center;position:relative;user-select:none}.sq.light{background:#d9c7a1}.sq.dark{background:#8a6b4d}.sq.sel{outline:4px solid #5da4d6;outline-offset:-4px}.sq.last{box-shadow:inset 0 0 0 4px #8fc46a}.sq img{width:88%;height:88%;object-fit:contain;pointer-events:none}.coord{position:absolute;z-index:3;font-size:clamp(9px,1.8vw,14px);font-weight:800;line-height:1;pointer-events:none;text-shadow:0 1px 2px #0008}.coord.file{left:4px;bottom:3px}.coord.rank{right:4px;top:3px}.sq.light .coord{color:#6f5238}.sq.dark .coord{color:#ead8b4}.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.status{font-weight:800;margin-bottom:8px}.eval{font-family:monospace;font-size:22px;color:var(--gold)}.hint{color:var(--dim);font-size:13px;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button:disabled{opacity:.45}.actions button.danger{border-color:var(--red);color:var(--red)}.actions button.primary{border-color:var(--gold);color:var(--gold)}.moves{margin-top:12px;max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}.move{background:#202834;border:1px solid #303b49;border-radius:7px;padding:6px 8px;font-family:monospace}.explain{margin-top:12px;padding:10px;border-radius:10px;background:#10161e;border:1px solid var(--line);line-height:1.7;font-size:13px}@media(max-width:760px){.game{grid-template-columns:1fr}.side{width:min(92vw,560px);margin:auto}.mode{grid-template-columns:1fr 1fr 1fr}.top{align-items:flex-start}.nav{display:none}}
/* v17 visual system: native-app-like shell + external board coordinates */
body{background:linear-gradient(180deg,#0b1016 0%,#0f1620 55%,#0b1016 100%);}
.top{padding:18px 16px;position:sticky;top:0;z-index:10;background:rgba(13,17,23,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.top h1{font-size:21px;letter-spacing:.2px}.top small{font-size:11px}.nav a,.mode button,.actions button{box-shadow:0 4px 14px #0004;transition:.18s ease}.nav a:active,.mode button:active,.actions button:active{transform:translateY(1px) scale(.99)}
.board-shell{display:grid;grid-template-columns:24px auto;grid-template-rows:auto 24px;gap:3px;justify-content:center;align-items:stretch;direction:ltr;margin:0 auto;width:fit-content;max-width:100%;}
.board-shell>div:nth-child(2){min-width:0;width:min(86vw,560px)}.board-shell .board{width:100%;height:auto;aspect-ratio:1/1;}
.rank-rail{display:grid;grid-template-rows:repeat(8,1fr);font:800 12px/1 monospace;align-items:center;text-align:center;color:var(--dim);padding:2px 0;}
.file-rail{display:grid;grid-template-columns:repeat(8,1fr);font:800 12px/1 monospace;text-align:center;align-items:center;color:var(--dim);height:24px;}
.sq .coord{display:none!important;}
@media(max-width:760px){.board-shell{grid-template-columns:20px auto;grid-template-rows:auto 20px}.rank-rail,.file-rail{font-size:10px}.file-rail{height:20px}}
</style></head><body>
<div class="top"><div><h1>♞ Chessjust — العب</h1><small>لعب محلي ضد Stockfish</small></div><div class="nav"><a href="index.html">التحليل</a><a href="coach.html">المدرب</a></div></div>
<div class="wrap"><div class="mode"><button class="active" data-mode="normal">⚔️ Stockfish</button><button data-mode="beast">👹 الوحش الهجومي</button><button data-mode="defense">🛡️ دفاع الوحش</button></div>
<div class="game"><div><div class="board-shell"><div class="rank-rail" id="rankRail"></div><div><div class="file-rail" id="fileRail"></div><div id="board" class="board"></div></div></div><div class="actions"><button class="primary" id="newGame">🔄 مباراة جديدة</button><button id="flip">↔️ قلب الرقعة</button><button id="bestMove">💡 أفضل نقلة</button><button id="resign">🏳️ استسلام</button></div></div></div><div class="side"><div id="status" class="status">اختر نقلة</div><div id="eval" class="eval">+0.00</div><div id="hint" class="hint">العب ضد Stockfish محليًا. في وضع الوحش سيحاول المحرك اختيار خطوط أكثر حدة وضغطًا ضمن هامش تقييم معقول.</div><div class="explain" id="explain">💡 بعد المواقف المهمة سيظهر شرح محلي يوضح التهديد أو سبب أفضل رد، بدون API خارجي.</div><div class="moves" id="moves"></div></div></div></div>
<script src="./vendor/chess.min.js"></script><script>
'use strict';
const PIECE=(c,t)=>`./vendor/pieces/${c}${t.toUpperCase()}.svg`;
let game=new Chess(), selected=null, flipped=false, mode='normal', worker=null, engineReady=false, busy=false, lastMove=null, pending=null, thinkingStarted=0, gameEnded=false;
const $=id=>document.getElementById(id);
function boardSquares(){let a=[];for(let r=0;r<8;r++)for(let f=0;f<8;f++)a.push(String.fromCharCode(97+f)+(8-r));return a}
function draw(){const b=$('board');b.innerHTML='';let sqs=boardSquares();if(flipped)sqs.reverse();
  const files=[..."abcdefgh"], ranks=["8","7","6","5","4","3","2","1"];
  const rf=$('rankRail'), ff=$('fileRail');
  if(rf) rf.innerHTML=(flipped?[...ranks].reverse():ranks).map(x=>`<span>${x}</span>`).join('');
  if(ff) ff.innerHTML=(flipped?[...files].reverse():files).map(x=>`<span>${x}</span>`).join('');
  for(const sq of sqs){const f=sq.charCodeAt(0)-97,r=8-parseInt(sq[1]),d=document.createElement('div');d.className='sq '+((f+r)%2?'dark':'light');if(selected===sq)d.classList.add('sel');if(lastMove&&(lastMove.from===sq||lastMove.to===sq))d.classList.add('last');
    const p=game.get(sq);if(p){const img=document.createElement('img');
      /* Correct mapping: Cburnett asset names match chess piece types directly. */
      img.src=PIECE(p.color,p.type);img.onerror=()=>{img.remove();const fallback={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[p.type];d.appendChild(document.createTextNode(fallback))};d.appendChild(img)}d.onclick=()=>clickSq(sq);b.appendChild(d)}}
function clickSq(sq){if(busy||game.game_over())return;if(game.turn()!=='w')return;if(!selected){if(game.get(sq)?.color==='w'){selected=sq;draw()}return}let mv=game.move({from:selected,to:sq,promotion:'q'});if(!mv){if(game.get(sq)?.color==='w')selected=sq;else selected=null;draw();return}lastMove={from:mv.from,to:mv.to};selected=null;busy=true;renderMoves();explainMove(mv);draw();updateStatus();setTimeout(engineTurn,80)}
function renderMoves(){let arr=game.history();$('moves').innerHTML=arr.map((m,i)=>`<span class="move">${Math.floor(i/2)+1}${i%2?'...':'.'} ${m}</span>`).join('')}
function updateStatus(){if(game.in_checkmate())$('status').textContent=game.turn()==='w'?'كش مات — Stockfish فاز':'كش مات — أنت فزت';else if(game.in_draw())$('status').textContent='تعادل';else if(game.game_over())$('status').textContent='انتهت المباراة';else $('status').textContent=game.turn()==='w'?'دورك':'Stockfish يفكر...'; const end=game.game_over()||gameEnded; $('bestMove').disabled=end||busy; $('resign').disabled=end;}
function explainMove(mv){let s='نقلة جيدة، راقب تهديدات الخصم بعد كل نقلة.';if(mv.captured)s=`أخذت ${mv.captured}. انتبه إلى الرد الإجباري وإعادة حساب حماية القطعة.`;if(mv.san.includes('+'))s='كش! النقلة تخلق تهديدًا مباشرًا، لكن يجب التأكد من الردود الإجبارية.';$('explain').textContent=s}
function makeWorker(path){
 if(worker)worker.terminate();
 clearTimeout(engineTimer); engineReady=false; enginePath=path||'./vendor/stockfish-18-single.js';
 worker=new Worker(enginePath);
 worker.onerror=()=>{ if(enginePath!=='./vendor/stockfish-18-lite-single.js'){ makeWorker('./vendor/stockfish-18-lite-single.js'); } else { busy=false; $('status').textContent='تعذر تشغيل Stockfish'; } };
 worker.onmessage=e=>{
  const x=String(e.data||'');
  if(x==='uciok'){worker.postMessage('setoption name Threads value 1');worker.postMessage('setoption name MultiPV value 1');worker.postMessage('isready')}
  else if(x==='readyok'){engineReady=true;if(pending){pending();pending=null}}
  else if(x.startsWith('info')&&x.includes('score')){
   const m=x.match(/score (cp|mate) (-?\d+)/); if(m)$('eval').textContent=m[1]==='mate'?`#${m[2]}`:(Number(m[2])/100).toFixed(2);
   const pv=x.match(/\smultipv (\d+).*?\spv\s(.+)$/); const sc=x.match(/\sscore (cp|mate) (-?\d+)/);
   if(pv&&sc&&engineCandidates){engineCandidates[Number(pv[1])-1]={uci:pv[2].trim().split(/\s+/)[0],score:sc[1]==='cp'?Number(sc[2]):(Number(sc[2])>0?100000:-100000),pv:pv[2].trim()};}
  } else if(x.startsWith('bestmove')){clearTimeout(engineTimer);const u=x.split(/\s+/)[1];if(u&&pendingMoveResolve){const r=pendingMoveResolve;const candidates=engineCandidates?engineCandidates.filter(Boolean):[];const chosen=candidates.find(x=>x.uci===u)||{uci:u,score:0,pv:u};r({chosen,candidates});pendingMoveResolve=null;engineCandidates=null;}}
 };
 worker.postMessage('uci')
}
let pendingMoveResolve=null,engineCandidates=null, engineTimer=null, enginePath='./vendor/stockfish-18-single.js', engineAttempts=0;
function askEngine(){return new Promise(resolve=>{pendingMoveResolve=resolve;engineCandidates=[];const multi=(mode==='normal'?1:5);const ms=(mode==='normal'?1800:(mode==='beast'?3000:2400));worker.postMessage('stop');worker.postMessage('setoption name MultiPV value '+multi);worker.postMessage('position fen '+game.fen());thinkingStarted=performance.now();$('status').textContent='Stockfish يفكر...';worker.postMessage('go movetime '+ms);clearTimeout(engineTimer);engineTimer=setTimeout(()=>{if(pendingMoveResolve){worker.postMessage('stop'); if(enginePath!=='./vendor/stockfish-18-lite-single.js'){makeWorker('./vendor/stockfish-18-lite-single.js'); setTimeout(()=>askEngine().then(resolve),180); } else {pendingMoveResolve=null;busy=false;$('status').textContent='تعذر إكمال حساب Stockfish';resolve(null);}}},Math.max(ms+2500,5000))})}
function attackScore(uci){
 try{
  const c=new Chess(game.fen()); const mv=c.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'}); if(!mv)return -999;
  let score=0; if(mv.san.includes('+'))score+=7; if(mv.captured)score+=2;
  const enemyKing=c.board().flat().findIndex(p=>p&&p.type==='k'&&p.color==='w');
  if(enemyKing>=0){const kf=enemyKing%8,kr=Math.floor(enemyKing/8),tf=mv.to.charCodeAt(0)-97,tr=8-Number(mv.to[1]);const d=Math.abs(kf-tf)+Math.abs(kr-tr);score+=Math.max(0,4-d)*1.2}
  if(mv.piece==='q'||mv.piece==='r'||mv.piece==='b')score+=1;
  return score;
 }catch(e){return 0}
}
async function engineTurn(){
  if(game.game_over() || game.turn()!=='b'){busy=false;updateStatus();return}
  if(!worker) makeWorker();
  if(!engineReady){
    $('status').textContent='Stockfish يستعد...';
    await new Promise(resolve=>{
      const started=Date.now();
      const wait=()=>{
        if(engineReady) return resolve();
        if(Date.now()-started>5000) return resolve();
        setTimeout(wait,50);
      };
      wait();
    });
  }
  if(!engineReady){busy=false;$('status').textContent='تعذر تشغيل Stockfish';return}
  await chooseEngineMove();
}

async function chooseEngineMove(){
 const result=await askEngine();
 let chosen=result?.chosen||null;
 const candidates=result?.candidates||[];
 if(mode!=='normal'&&candidates.length){
   const bestScore=chosen?.score ?? candidates[0]?.score ?? 0; const margin=mode==='beast'?90:45;
   const eligible=candidates.filter(x=>Math.abs(bestScore-x.score)<=margin);
   if(eligible.length>1){
     eligible.sort((a,b)=>attackScore(b.uci)-attackScore(a.uci)); chosen=eligible[0];
   }
 }
 if(!chosen){busy=false;updateStatus();return}
 const u=chosen.uci; const mv=game.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});
 if(mv){lastMove={from:mv.from,to:mv.to};renderMoves();explainEngineMove(mv,mode)}
 draw();busy=false;updateStatus()
}
function explainEngineMove(mv,m){
 if(m==='beast')$('explain').textContent=mv.san.includes('+')?'👹 هجوم مباشر: كش وإجبار الملك على الرد.':'👹 الوحش يفضّل ضغطًا حادًا عندما يكون قريبًا في التقييم: راقب التهديد التالي وفتح الخطوط حول الملك.';
 else if(m==='defense')$('explain').textContent='🛡️ هذا الوضع يركز على الضغط والدفاع: ابحث عن التهديد التالي وحافظ على أمان الملك.';
 else explainMove(mv)
}

async function showBestMove(){
 if(busy||game.game_over()||game.turn()!=='w')return;
 busy=true; updateStatus(); $('status').textContent='يحسب أفضل نقلة...';
 try{ const r=await askEngine(); const u=r?.chosen?.uci; if(u){const c=new Chess(game.fen());const mv=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'}); if(mv){lastMove={from:mv.from,to:mv.to};$('eval').textContent=r.chosen.score!=null?(Number(r.chosen.score)/100).toFixed(2):$('eval').textContent;$('explain').textContent='💡 أفضل نقلة حاليًا: '+mv.san+' — جرّب اكتشافها بنفسك قبل تنفيذها.';draw();}}}
 catch(e){$('explain').textContent='تعذر حساب أفضل نقلة الآن.';}
 busy=false; updateStatus();
}
function resignGame(){ if(game.game_over()||gameEnded)return; gameEnded=true; busy=false; if(worker)worker.postMessage('stop'); $('status').textContent='استسلمت — انتهت المباراة'; $('explain').textContent='🏳️ انتهت المباراة. اضغط «مباراة جديدة» لبدء مباراة أخرى.'; updateStatus();}
$('newGame').onclick=()=>{if(worker)worker.postMessage('stop');game=new Chess();selected=null;lastMove=null;busy=false;gameEnded=false;$('eval').textContent='+0.00';$('explain').textContent='💡 مباراة جديدة. حاول التفكير في التهديد قبل النقلة.';renderMoves();draw();updateStatus();if(!worker)makeWorker()};$('flip').onclick=()=>{flipped=!flipped;draw()};$('bestMove').onclick=showBestMove;$('resign').onclick=resignGame;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('hint').textContent=mode==='normal'?'⚔️ Stockfish: رد سريع وقوي في حوالي 1–2.5 ثانية.':(mode==='beast'?'👹 الوحش: ضغط وتكتيك وهجوم على الملك، مع وقت تفكير أطول.':'🛡️ دفاع الوحش: تدريب على مواجهة التهديدات والهجمات، مع بحث أعمق.');});makeWorker();draw();updateStatus();
</script></body></html>
