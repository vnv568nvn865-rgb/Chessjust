<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chessjust — الألغاز</title><style>
:root{--bg:#0b1118;--p:#151e29;--p2:#1b2734;--l:#2d3a49;--ink:#f3f6f9;--d:#9aa8b7;--g:#d9b35b;--ok:#63ba7b;--bad:#d65d5d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101923,#0b1118);color:var(--ink);font-family:system-ui,Arial}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);position:sticky;top:0;background:#0b1118ed;backdrop-filter:blur(12px);z-index:5}.nav{display:flex;gap:6px}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--l);padding:7px 9px;border-radius:9px;font-size:11px}.nav a.active{color:var(--g);border-color:var(--g)}main{max-width:900px;margin:auto;padding:14px}.head,.board,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px}.head{padding:14px;margin-bottom:12px}.head h1{margin:0 0 4px;font-size:20px}.head p{margin:0;color:var(--d);font-size:12px}.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.pill{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:7px 10px;font-size:11px}.pill b{color:var(--g)}.board{padding:10px;max-width:620px;margin:auto}.sqboard{direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,52px);cursor:pointer}.light{background:#d9c7a1}.dark{background:#8a6b4d}.sel{outline:4px solid #63a6d8;outline-offset:-4px}.piece{width:86%;height:86%;object-fit:contain}.panel{padding:12px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.msg{line-height:1.7;color:var(--d);font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:800}.btn.primary{border-color:var(--g);color:var(--g)}.line{direction:ltr;display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.move{background:#202b37;border:1px solid #344252;border-radius:7px;padding:5px 7px;font-family:monospace}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.hint{font-size:11px;color:var(--d);margin-top:8px}@media(max-width:650px){.nav a:nth-child(1),.nav a:nth-child(2){display:none}}
</style></head><body><header class="top"><b>♞ Chessjust — الألغاز الصعبة</b><nav class="nav"><a href="academy.html">الأكاديمية</a><a href="tactics.html">التكتيكات</a><a href="openings.html">الافتتاحيات</a><a href="puzzles.html">الألغاز</a></nav></header><main><section class="head"><h1>🔥 ألغاز 2500+</h1><p>لا يكفي العثور على أول نقلة. أكمل الفكرة حتى نهاية الخط المطلوب.</p><div class="bar"><div class="pill">التصنيف: <b id="rating">2500+</b></div><div class="pill">محلول: <b id="solved">0</b></div><div class="pill">سلسلة: <b id="streak">0</b></div><div class="pill">المستوى: <b id="level">تدريب</b></div></div></section><section class="board"><div id="board" class="sqboard"></div></section><section class="panel"><div class="row"><b id="title">الموقف 1</b><span id="turn">دورك</span></div><div class="msg" id="msg">اختر نقلة على الرقعة. سيبحث Stockfish محليًا عن الحل ويحدد إذا كانت بداية التكتيك صحيحة.</div><div class="line" id="line"></div><div class="result" id="result"></div><div class="buttons"><button class="btn primary" id="new">موقف جديد</button><button class="btn" id="hintBtn">💡 تلميح</button><button class="btn" id="skip">تخطي</button></div><div class="hint" id="hint"></div></section></main><script src="./vendor/chess.min.js"></script><script src="./js/analysis-engine.js"></script><script src="./js/chessjust-progress.js"></script><script>
const seeds=[
['fork','1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Ba4 Nf6 5. O-O Be7 6. Re1 b5 7. Bb3 d6'],['attack','1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5'],['center','1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Be7 5. e3 O-O 6. Nf3'],['king','1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Nxd4 Nf6 5. Nc3'],['pin','1. e4 e5 2. Nf3 Nc6 3. Nc3 Nf6 4. Bb5 Bb4 5. O-O O-O'],['sacrifice','1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4 Bxb4 5. c3 Ba5 6. O-O'],['openfile','1. d4 Nf6 2. c4 e6 3. Nc3 Bb4 4. e3 O-O 5. Bd3 d5'],['queen','1. e4 c5 2. Nc3 Nc6 3. f4 g6 4. Nf3 Bg7 5. Bb5'],['bishop','1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. c3 Nf6 5. d4 exd4'],['deflect','1. d4 d5 2. c4 c6 3. Nc3 Nf6 4. Nf3 dxc4 5. a4 Bf5'],['rook','1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Bc4 Nf6 5. O-O'],['mate','1. f4 e5 2. fxe5 d6 3. exd6 Bxd6 4. Nf3 g5 5. e4 g4'],['double','1. e4 c5 2. Nf3 Nc6 3. Bb5 g6 4. Bxc6 dxc6 5. d4'],['backrank','1. d4 d5 2. Nf3 Nf6 3. c4 e6 4. Nc3 Be7 5. Bg5 O-O'],['clearance','1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. d4 exd4 5. O-O'],['zwischen','1. d4 Nf6 2. c4 g6 3. Nc3 d5 4. cxd5 Nxd5 5. e4 Nxc3'],['skewer','1. e4 e5 2. Nf3 Nc6 3. Bb5 Nf6 4. O-O Nxe4 5. Re1'],['discovered','1. e4 e5 2. Nf3 Nc6 3. d4 exd4 4. Nxd4 Nf6 5. Nc3 Bb4'],['zwischenzug','1. d4 d5 2. c4 e5 3. dxe5 d4 4. Nf3 Nc6 5. a3'],['hanging','1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Nc6 5. Bb5']
];
const tasks=Array.from({length:60},(_,i)=>({base:seeds[i%seeds.length],id:'T'+String(i+1).padStart(2,'0'),target:3+(i%3)}));
let engine=null,chess=null,selected=null,current=null,busy=false,solution=null,stage=0;
const $=id=>document.getElementById(id);
function draw(){const b=$('board');b.innerHTML='';const files=['a','b','c','d','e','f','g','h'];for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq=files[f]+r,d=document.createElement('div');d.className='sq '+(((f+r)%2)?'dark':'light');if(selected===sq)d.classList.add('sel');const pc=chess.get(sq);if(pc){const img=document.createElement('img');img.className='piece';img.src=`./vendor/pieces/${pc.color}${pc.type.toUpperCase()}.svg`;img.onerror=()=>{img.remove();d.textContent={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[pc.type]};d.appendChild(img)}d.onclick=()=>click(sq);b.appendChild(d)}}
function refresh(){const d=CJProgress.get().puzzles;$('rating').textContent=d.rating;$('solved').textContent=d.solved;$('streak').textContent=d.streak;$('level').textContent=d.rating>=2500?'2500+':d.rating>=1800?'متقدم':'تدريب'}
function initBoard(){chess=new Chess();chess.load_pgn(current.base[1]);selected=null;stage=0;draw();$('line').innerHTML='';$('result').textContent='';$('result').className='result';$('hint').textContent='';$('msg').textContent=`هذا الموقف يحتاج ${current.target} نقلات صحيحة متتالية. لا تتوقف بعد أول نقلة.`;refresh()}
async function init(){engine=new AnalysisEngine({stockfishPath:'./vendor/stockfish-18-single.js',poolSize:1});try{await engine.initialize();await next();}catch(e){$('msg').textContent='تعذر تشغيل Stockfish: '+e.message}}
async function next(){current=tasks[(CJProgress.get().puzzles.solved)%tasks.length];initBoard();$('title').textContent=`${current.id} — ${current.base[0]} — ${current.target} نقلات`;try{solution=await engine.queryPosition(chess.fen(),1400000);$('msg').textContent=`ابحث عن النقلة الأولى. بعد كل إجابة صحيحة سيُكمل الخصم أفضل رد، ثم تبحث عن النقلة التالية.`}catch(e){$('msg').textContent='خطأ في المحرك: '+e.message}}
async function click(sq){if(busy||!chess||chess.game_over())return;if(!selected){if(chess.get(sq)?.color===chess.turn()){selected=sq;draw()}return}const mv=chess.move({from:selected,to:sq,promotion:'q'});if(!mv){selected=chess.get(sq)?.color===chess.turn()?sq:null;draw();return}selected=null;draw();await checkMove(mv.from+mv.to+(mv.promotion||''))}
async function checkMove(uci){busy=true;try{const best=solution?.bestmove;if(best&&uci!==best){$('result').className='result bad';$('result').textContent='❌ خطأ في هذه المرحلة — التكتيك انكسر هنا.';chess.undo();draw();const t=CJProgress.recordPuzzle(false,current.id);refresh();return}
stage++;$('line').innerHTML+=`<span class="move">${uci}</span>`;if(stage>=current.target){$('result').className='result ok';$('result').textContent='🎯 أحسنت! أكملت الفكرة التكتيكية كاملة.';const t=CJProgress.recordPuzzle(true,current.id);refresh();return}
// رد الخصم: نأخذ الرد الثاني من PV إن وجد، وإلا نطلبه من المحرك.
let reply=solution?.pv?.[1];if(!reply){const rr=await engine.queryPosition(chess.fen(),900000);reply=rr?.bestmove}if(!reply){$('result').textContent='تعذر الحصول على رد الخصم.';return}const rm=chess.move({from:reply.slice(0,2),to:reply.slice(2,4),promotion:reply[4]||'q'});if(rm)$('line').innerHTML+=`<span class="move">${reply}</span>`;draw();solution=await engine.queryPosition(chess.fen(),1400000);$('msg').textContent=`النقلة ${stage+1} من ${current.target}: لا تنظر إلى الحل السابق؛ ابحث عن التهديد الجديد.`;if(stage===1)$('hint').textContent='الخصم رد بأفضل دفاع. الآن يبدأ الجزء الأهم من التكتيك.';
}finally{busy=false}}
$('new').onclick=next;$('skip').onclick=next;$('hintBtn').onclick=()=>{$('hint').textContent=`الموضوع: ${current.base[0]}. افحص النقلات الإجبارية أولًا: كش، أخذ، تهديد مباشر.`};refresh();init();
</script></body></html>
