<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chessjust — الألغاز</title><style>:root{--bg:#0b1118;--p:#151e29;--p2:#1b2734;--l:#2d3a49;--ink:#f3f6f9;--d:#9aa8b7;--g:#d9b35b;--ok:#63ba7b;--bad:#d65d5d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101923,#0b1118);color:var(--ink);font-family:system-ui,Arial;touch-action:manipulation}.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);position:sticky;top:0;background:#0b1118ed;z-index:5}.nav{display:flex;gap:6px}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--l);padding:7px 9px;border-radius:9px;font-size:11px}main{max-width:900px;margin:auto;padding:14px}.head,.board,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px}.head{padding:14px;margin-bottom:12px}.head h1{margin:0 0 4px;font-size:20px}.head p{margin:0;color:var(--d);font-size:12px}.bar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.pill{background:var(--p2);border:1px solid var(--l);border-radius:10px;padding:7px 10px;font-size:11px}.pill b{color:var(--g)}.board{padding:10px;max-width:620px;margin:auto}.sqboard{direction:ltr;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;touch-action:none}.sq{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,7vw,52px);cursor:pointer;-webkit-tap-highlight-color:transparent}.light{background:#d9c7a1}.dark{background:#8a6b4d}.sel{outline:4px solid #63a6d8;outline-offset:-4px}.piece{width:86%;height:86%;object-fit:contain;pointer-events:none}.panel{padding:12px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.msg{line-height:1.7;color:var(--d);font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--l);background:var(--p2);color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:800;touch-action:manipulation}.btn.primary{border-color:var(--g);color:var(--g)}.line{direction:ltr;display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.move{background:#202b37;border:1px solid #344252;border-radius:7px;padding:5px 7px;font-family:monospace}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.hint{font-size:12px;color:var(--g);margin-top:8px;font-weight:700}</style></head><body><header class="top"><b>♞ Chessjust — 🔥 ألغاز 2500+</b><nav class="nav"><a href="academy.html">الأكاديمية</a><a href="tactics.html">التكتيكات</a><a href="openings.html">الافتتاحيات</a><a href="puzzles.html">الألغاز</a></nav></header><main><section class="head"><h1>🔥 ألغاز 2500+</h1><p id="sub">كل الخطوط التدريبية محفوظة محليًا لتكون الاستجابة فورية.</p><div class="bar"><div class="pill">التصنيف: <b id="rating">800</b></div><div class="pill">محلول: <b id="solved">0</b></div><div class="pill">سلسلة: <b id="streak">0</b></div><div class="pill">التقدم: <b id="points">0/1200</b></div><div class="pill"><b id="stage">المرحلة 1/60</b></div></div></section><section class="board"><div id="board" class="sqboard"></div></section><section class="panel"><div class="row"><b id="title">الموقف</b><span id="turn">دورك</span></div><div class="msg" id="msg"></div><div class="line" id="line"></div><div class="result" id="result"></div><div class="buttons"><button class="btn primary" id="new">المراحل التالية</button><button class="btn" id="hintBtn">💡 أفضل نقلة</button><button class="btn" id="skip">المرحلة التالية</button></div><div class="hint" id="hint"></div></section></main><script src="./vendor/chess.min.js"></script><script src="./js/chessjust-progress.js"></script><script>
const seeds=[['mate_in_2','1. e4 e5 2. Qh5 Nc6 3. Bc4 Nf6 4. Qxf7#'],['attack_king','1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. Ng5 d5 5. exd5 Nxd5 6. Qf3'],['sacrifice','1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. b4 Bxb4 5. c3 Ba5 6. O-O Nf6'],['trapped_piece','1. d4 Nf6 2. c4 e6 3. Nc3 Bb4 4. Qc2 O-O 5. a3 Bxc3+ 6. Qxc3'],['queen_trap','1. e4 e5 2. Nf3 Qh4 3. Nc3 Bb4 4. Nxe5 Qxe4+ 5. Be2'],['mate_net','1. d4 d5 2. c4 e6 3. Nc3 Nf6 4. Bg5 Be7 5. e3 O-O 6. Bd3'],['rook_tactic','1. e4 c5 2. Nf3 d6 3. d4 cxd4 4. Qxd4 Nc6 5. Bb5 Bd7'],['bishop_sac','1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. Bxf7+ Kxf7 5. Nxe5+'],['fork_knight','1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 4. Bxc6 dxc6 5. Nxe5'],['promotion','1. d4 d5 2. c4 c6 3. Nc3 Nf6 4. e3 Bf5 5. Nf3 e6']];
const tasks=Array.from({length:60},(_,i)=>({base:seeds[i%seeds.length],id:'P'+String(i+1).padStart(2,'0'),target:3+(i%3)}));
let chess=null,selected=null,current=null,line=[],plyIndex=0,busy=false,taskIndex=0;
const $=id=>document.getElementById(id),files=['a','b','c','d','e','f','g','h'];
function makeTask(t){const full=new Chess();if(!full.load_pgn(t.base[1]))return [];const all=full.history({verbose:true});const n=Math.min(t.target,all.length);const prefix=all.slice(0,-n),sol=all.slice(-n);chess=new Chess();prefix.forEach(m=>chess.move({from:m.from,to:m.to,promotion:m.promotion||undefined}));return sol.map(m=>({from:m.from,to:m.to,promotion:m.promotion||'',san:m.san,color:m.color}));}
function draw(){const b=$('board');b.innerHTML='';for(let r=8;r>=1;r--)for(let f=0;f<8;f++){const sq=files[f]+r,d=document.createElement('div');d.className='sq '+(((f+r)%2)?'dark':'light');if(selected===sq)d.classList.add('sel');const pc=chess.get(sq);if(pc){const img=document.createElement('img');img.className='piece';img.src=`./vendor/pieces/${pc.color}${pc.type.toUpperCase()}.svg`;img.onerror=()=>{img.remove();d.textContent={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'}[pc.type]};d.appendChild(img)}d.onpointerup=()=>click(sq);b.appendChild(d)}}
function refresh(){const d=CJProgress.get().puzzles;$('rating').textContent=d.rating;$('solved').textContent=d.solved;$('streak').textContent=d.streak;if($('points'))$('points').textContent=`${d.points}/1200`;if($('stage'))$('stage').textContent=`المرحلة ${Math.min(d.currentStage+1,60)}/60`;}
function loadTask(){const p=CJProgress.get().puzzles;taskIndex=Math.min(p.currentStage,59);current=tasks[taskIndex];line=makeTask(current);plyIndex=0;selected=null;busy=false;draw();$('title').textContent=`${current.id} — ${current.base[0]} — ${line.length} نقلات في الحل`;$('msg').textContent=`المرحلة ${taskIndex+1}/60 — أكمل الحل المحفوظ كاملًا.`;$('result').textContent='';$('result').className='result';$('hint').textContent='';$('line').innerHTML='';refresh();autoAdvanceOpponent();}
function expectedMove(){const e=line[plyIndex];return e&&e.color===chess.turn()?e:null;}
function showProgress(){ $('msg').textContent=`النقلة ${Math.min(plyIndex+1,line.length)} من ${line.length} في الحل المحفوظ.`; }
function finish(){ $('result').className='result ok';$('result').textContent='🎯 أحسنت! +20 نقطة تقدم';CJProgress.recordPuzzle(true,current.base[0],current.id);refresh(); }
function autoAdvanceOpponent(){while(line[plyIndex]&&line[plyIndex].color!==chess.turn()){const m=line[plyIndex];const rm=chess.move({from:m.from,to:m.to,promotion:m.promotion||undefined});if(!rm)break;$('line').innerHTML+=`<span class="move">${rm.san}</span>`;plyIndex++;}if(plyIndex>=line.length){finish();return;}showProgress();draw();}
function click(sq){if(busy||!chess||chess.game_over()||plyIndex>=line.length)return;if(!selected){if(chess.get(sq)?.color===chess.turn()){selected=sq;draw()}return}const expected=expectedMove();const mv=chess.move({from:selected,to:sq,promotion:expected?.promotion||'q'});if(!mv){selected=chess.get(sq)?.color===chess.turn()?sq:null;draw();return}selected=null;if(!expected||mv.from!==expected.from||mv.to!==expected.to||(mv.promotion||'')!==(expected.promotion||'')){chess.undo();draw();$('result').className='result bad';$('result').textContent='❌ نقلة خاطئة — الحل المحفوظ لم يتغير.';return}plyIndex++;$('line').innerHTML+=`<span class="move">${mv.san}</span>`;draw();if(plyIndex>=line.length){finish();return;}busy=true;setTimeout(()=>{busy=false;autoAdvanceOpponent()},600);}
$('new').onclick=loadTask;$('skip').onclick=loadTask;$('hintBtn').onclick=()=>{const e=expectedMove();$('hint').textContent=e?`💡 أفضل نقلة في الحل المحفوظ: ${e.san}`:'لا توجد نقلة لك الآن؛ رد الخصم سيظهر تلقائيًا.'};refresh();loadTask();
</script></body></html>
